name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXORA-Android-Project-v1.4.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f NEXORA-Android-Project-v1.4.zip
          unzip -o NEXORA-Android-Project-v1.4.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: NEXORA
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-debug-apk
          path: NEXORA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
